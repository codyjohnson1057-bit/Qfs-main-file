    <script>
        "use strict";

        // ============================================================
        //  IZITOAST NOTIFICATION (same as your working version)
        // ============================================================
        const colors = {
            success: '#28c76f',
            error: '#eb2222',
            warning: '#ff9f43',
            info: '#1e9ff2',
        };
        const icons = {
            success: 'fas fa-check-circle',
            error: 'fas fa-times-circle',
            warning: 'fas fa-exclamation-triangle',
            info: 'fas fa-exclamation-circle',
        };

        const triggerToaster = (status, message) => {
            if (typeof iziToast === 'undefined') {
                console.log(status + ': ' + message);
                return;
            }
            iziToast[status]({
                title: status.charAt(0).toUpperCase() + status.slice(1),
                message: message,
                position: "topRight",
                backgroundColor: '#fff',
                icon: icons[status],
                iconColor: colors[status],
                progressBarColor: colors[status],
                titleSize: '1rem',
                messageSize: '1rem',
                titleColor: '#474747',
                messageColor: '#a2a2a2',
                transitionIn: 'bounceInLeft'
            });
        };

        function notify(status, message) {
            if (typeof message === 'string') {
                triggerToaster(status, message);
            } else {
                Object.keys(message || {}).forEach(k => triggerToaster(status, message[k]));
            }
        }

        // ============================================================
        //  FILE PREVIEW
        // ============================================================
        function bindPreview(inputId, previewId) {
            const input = document.getElementById(inputId);
            const img = document.getElementById(previewId);
            if (!input || !img) return;

            input.addEventListener('change', function() {
                const file = this.files && this.files[0];
                if (!file) return;
                if (file.type && file.type.indexOf('image/') === 0) {
                    const reader = new FileReader();
                    reader.onload = e => img.src = e.target.result;
                    reader.readAsDataURL(file);
                } else {
                    img.src = img.dataset.prev || '/assets/img/placeholder.png';
                    img.alt = 'File: ' + file.name;
                }
            });
        }
        bindPreview('poi', 'poiPreview');
        bindPreview('poa', 'poaPreview');

        // ============================================================
        //  THEME TOGGLE (light/dark) with localStorage
        // ============================================================
        (function() {
            const html = document.documentElement;
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            if (!toggleBtn) return;

            const saved = localStorage.getItem('theme') || 'light';
            html.classList.remove('light', 'dark');
            html.classList.add(saved);
            updateIcon(saved);

            toggleBtn.addEventListener('click', function() {
                const current = html.classList.contains('dark') ? 'dark' : 'light';
                const next = current === 'dark' ? 'light' : 'dark';
                html.classList.remove('light', 'dark');
                html.classList.add(next);
                localStorage.setItem('theme', next);
                updateIcon(next);
            });

            function updateIcon(theme) {
                if (icon) {
                    icon.name = theme === 'dark' ? 'sunny-outline' : 'moon-outline';
                }
            }
        })();

        // ============================================================
        //  IFRAME SUBMISSION HANDLER (no AJAX, no reload)
        // ============================================================
        (function() {
            const form = document.getElementById('kycForm');
            const iframe = document.getElementById('kyc_frame');
            const btn = document.getElementById('kyc_btn');
            const originalHtml = btn ? btn.innerHTML : '';

            if (!form || !iframe || !btn) return;

            // When form is submitted: disable button, show spinner
            form.addEventListener('submit', function() {
                btn.disabled = true;
                btn.innerHTML = 'Submitting… <span class="spinner-border spinner-border-sm ms-1" role="status" aria-hidden="true"></span>';
            });

            // When iframe loads, the form submission is complete.
            iframe.addEventListener('load', function() {
                // Only act if the button is disabled (i.e., we submitted)
                if (!btn.disabled) return;

                // Success: show toast, reset form, re-enable button
                notify('success', 'Your information was submitted successfully. Please wait while your identity is being verified.');

                // Reset form
                form.reset();

                // Reset preview images to placeholder
                const poiImg = document.getElementById('poiPreview');
                const poaImg = document.getElementById('poaPreview');
                if (poiImg && poiImg.dataset.prev) poiImg.src = poiImg.dataset.prev;
                if (poaImg && poaImg.dataset.prev) poaImg.src = poaImg.dataset.prev;

                // Re-enable button
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            });

            // Safety net: if something goes wrong and iframe never loads, re-enable after 15s
            form.addEventListener('submit', function() {
                setTimeout(function() {
                    if (btn.disabled) {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                }, 15000);
            });
        })();

        console.log('✅ KYC form with iframe (no AJAX, no reload) – files are sent, page stays.');
    </script>
