<style>
  :root{
    --gold:#B8860B;
    --gold-bright:#D4A017;
    --green-deep:#0A3D2A;
    --green-mint:#059669;
    --ink:#e8f5f0;
    --panel:rgba(16,185,129,0.14);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:linear-gradient(165deg,#f4fbf8 0%,#e6f4ef 45%,#eef8f4 100%);
    color:var(--green-deep);
    font-family:'Space Mono',monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  /* ---------- matrix rain canvas ---------- */
  #rain{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }

  /* click/touch burst layer sits above rain, below content */
  #burst{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  /* vignette to keep center readable */
  #vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(232,245,240,0.15) 0%, rgba(230,244,239,0.45) 55%, rgba(220,240,230,0.75) 100%);
  }

  /* ---------- intro overlay ---------- */
  #overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:#e8f5f0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 1.4s ease, visibility 1.4s ease;
  }
  #overlay.hide{
    opacity:0;
    visibility:hidden;
  }
  .glitch-logo{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(1.3rem,5vw,2.5rem);
    letter-spacing:.35em;color:var(--gold-bright);
    text-shadow:0 0 18px rgba(212,175,55,.35);
    animation:flicker 2.6s infinite;text-align:center;
  }
  .glitch-sub{
    margin-top:.9rem;text-align:center;
    letter-spacing:.45em;font-size:.62rem;
    color:var(--green-mint);opacity:.85;
  }
  @keyframes flicker{
    0%,19%,21%,23%,80%,100%{opacity:1;}
    20%,22%,79%{opacity:.35;}
  }

  /* ---------- main stage ---------- */
  #stage{
    position:relative;
    z-index:10;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 1.5rem;
    perspective:1200px;
  }

  .eyebrow{
    font-size:.7rem;
    letter-spacing:.5em;
    color:var(--green-mint);
    margin-bottom:1.1rem;
    opacity:.8;
  }

  #wordmark{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2.6rem,10vw,6rem);
    letter-spacing:.12em;
    line-height:1;
    color:var(--gold);
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .12s ease-out;
    text-shadow:
      0 1px 0 rgba(10,61,42,.15),
      0 8px 24px rgba(15,80,60,.12),
      0 0 40px rgba(212,175,55,.2);
  }

  #tagline{
    font-family:'Orbitron',sans-serif;
    font-weight:600;
    font-size:clamp(.75rem,2vw,1rem);
    letter-spacing:.6em;
    color:var(--green-mint);
    margin-top:1.4rem;
    text-shadow:0 0 18px rgba(152,255,152,.5);
  }

  .divider{
    width:min(60vw,320px);
    height:1px;
    margin:2.6rem 0 2.4rem;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity:.6;
  }

  /* ---------- buttons ---------- */
  .btn-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.95rem;
    width:100%;
    max-width:320px;
    margin:0 auto;
    perspective:800px;
  }
  .btn-row .btn{
    width:100%;
    text-align:center;
  }

  .btn{
    position:relative;
    display:inline-block;
    padding:1.15rem 3rem;
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.25em;
    text-decoration:none;
    border:2px solid var(--gold);
    color:var(--gold);
    background:linear-gradient(145deg,rgba(16,185,129,0.16),rgba(255,255,255,0.45));
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .15s ease-out, background .3s ease, color .3s ease, box-shadow .3s ease;
    backdrop-filter:blur(12px) saturate(1.3);
    -webkit-backdrop-filter:blur(12px) saturate(1.3);
    box-shadow:0 8px 28px rgba(15,80,60,0.1), inset 0 1px 0 rgba(255,255,255,0.55);
    border-radius:14px;
  }
  .btn::before{
    content:'';
    position:absolute;
    inset:0;
    border:1px solid var(--green-mint);
    opacity:0;
    transform:translateZ(-8px);
    transition:opacity .3s ease;
  }
  .btn:hover{
    color:var(--ink);
    background:var(--gold);
    box-shadow:0 10px 30px rgba(212,175,55,.35), 0 0 40px rgba(152,255,152,.25);
  }
  .btn:hover::before{opacity:1;}
  .btn.primary{
    background:var(--gold);
    color:var(--ink);
  }
  .btn.primary:hover{
    background:var(--green-deep);
    color:var(--green-mint);
    border-color:var(--green-mint);
  }

  .welcome{
    margin-top:3.2rem;
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:clamp(1.1rem,3.4vw,1.8rem);
    letter-spacing:.35em;
    color:var(--gold-bright);
    text-shadow:0 0 24px rgba(212,175,55,.5);
    animation:pulse 3.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.85;}
    50%{opacity:1;text-shadow:0 0 34px rgba(152,255,152,.55);}
  }

  @media(max-width:520px){
    #stage{padding:4.5vh 1.1rem 5.5vh;}
    .btn{padding:1rem 2.1rem;font-size:.9rem;letter-spacing:.2em;}
    .btn-row{gap:0.85rem;max-width:280px;}
    .welcome{margin-top:2.4rem;letter-spacing:.28em;}
    .divider{margin:2rem 0 1.9rem;}
  }
   @media(prefers-reduced-motion:reduce){
    .glitch-logo,.btn-primary::after,#overlay{animation:none;transition:none;}
  }

<script>
/* ============ MATRIX RAIN ============ */
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
let cols, drops, fontSize = 16;

function sizeRain(){
  rainCanvas.width = window.innerWidth;
  rainCanvas.height = window.innerHeight;
  cols = Math.floor(rainCanvas.width / fontSize);
  drops = new Array(cols).fill(0).map(()=> Math.random() * -100);
}
sizeRain();
window.addEventListener('resize', sizeRain);

const glyphs = '01';

function drawRain(){
  rctx.fillStyle = 'rgba(232, 245, 240, 0.14)';
  rctx.fillRect(0,0,rainCanvas.width, rainCanvas.height);
  rctx.font = fontSize + 'px monospace';

  for(let i=0;i<cols;i++){
    const char = glyphs[Math.floor(Math.random()*glyphs.length)];
    const x = i * fontSize;
    const y = drops[i] * fontSize;

    // leading character brighter
    rctx.fillStyle = Math.random() < 0.05 ? '#B8860B' : 'rgba(5,150,105,0.45)';
    rctx.fillText(char, x, y);

    if(y > rainCanvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
  requestAnimationFrame(drawRain);
}
requestAnimationFrame(drawRain);

/* ============ TOUCH / CLICK BURST ============ */
const burstCanvas = document.getElementById('burst');
const bctx = burstCanvas.getContext('2d');
function sizeBurst(){
  burstCanvas.width = window.innerWidth;
  burstCanvas.height = window.innerHeight;
}
sizeBurst();
window.addEventListener('resize', sizeBurst);

let particles = [];

function spawnBurst(x, y){
  const count = 14;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.4;
    const speed = 1.5 + Math.random()*3;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1,
      char: Math.random() < 0.5 ? '0' : '1',
      size: fontSize + Math.random()*10
    });
  }
}

function drawBurst(){
  bctx.clearRect(0,0,burstCanvas.width, burstCanvas.height);
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.018;
    bctx.globalAlpha = Math.max(p.life,0);
    bctx.fillStyle = '#D4AF37';
    bctx.shadowColor = '#98FF98';
    bctx.shadowBlur = 12;
    bctx.font = p.size + 'px monospace';
    bctx.fillText(p.char, p.x, p.y);
  });
  bctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
  requestAnimationFrame(drawBurst);
}
requestAnimationFrame(drawBurst);

function pointFromEvent(e){
  if(e.touches && e.touches.length){
    return {x:e.touches[0].clientX, y:e.touches[0].clientY};
  }
  return {x:e.clientX, y:e.clientY};
}

window.addEventListener('pointerdown', e => {
  const {x,y} = pointFromEvent(e);
  spawnBurst(x,y);
});
window.addEventListener('touchstart', e => {
  const {x,y} = pointFromEvent(e);
  spawnBurst(x,y);
}, {passive:true});

/* ============ 3D TILT (mouse + touch) ============ */
const wordmark = document.getElementById('wordmark');
const buttons = document.querySelectorAll('.btn');

function applyTilt(el, x, y, strength){
  const rect = el.getBoundingClientRect();
  const relX = (x - rect.left) / rect.width - 0.5;
  const relY = (y - rect.top) / rect.height - 0.5;
  el.style.transform = `rotateX(${(-relY*strength).toFixed(2)}deg) rotateY(${(relX*strength).toFixed(2)}deg) translateZ(10px)`;
}

function resetTilt(el){
  el.style.transform = 'rotateX(0deg) rotateY(0deg) translateZ(0)';
}

function handleMove(e){
  const {x,y} = pointFromEvent(e);
  applyTilt(wordmark, x, y, 10);
  buttons.forEach(b => applyTilt(b, x, y, 14));
}

window.addEventListener('pointermove', handleMove);
window.addEventListener('touchmove', e => { handleMove(e); }, {passive:true});
window.addEventListener('pointerleave', () => {
  resetTilt(wordmark);
  buttons.forEach(resetTilt);
});

/* ============ INTRO OVERLAY ============ */
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('overlay').classList.add('hide');
  }, 1600);
});
</script>
<script>
/* Light-only landing — no dark/auto theme, no theme FAB */
(function(){
  try{
    document.documentElement.classList.remove("dark");
    document.documentElement.classList.add("light");
    if(document.body) document.body.classList.remove("dark-mode");
    try{localStorage.setItem("ra-theme","light");localStorage.setItem("FinappDarkmode","0");}catch(e){}
    var dead=document.getElementById("raThemeToggle");
    if(dead&&dead.parentNode) dead.parentNode.removeChild(dead);
  }catch(e){}
})();
</script>
