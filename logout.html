<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>(function(){try{var t=localStorage.getItem("ra-theme");var f=null;try{f=localStorage.getItem("FinappDarkmode");}catch(x){}var mode=(t==="light"||t==="dark")?t:(f==="1"?"dark":f==="0"?"light":"light");if(mode==="light"){document.documentElement.classList.remove("dark");document.documentElement.classList.add("light");}else{document.documentElement.classList.add("dark");document.documentElement.classList.remove("light");}}catch(e){document.documentElement.classList.add("light");}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Robinhood Alliance — Sign Out</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
<link rel="stylesheet" href="static/css/glass-dashboard.css?v=1790030000">
<style>
  :root{
    --gold:#D4AF37;--gold-bright:#F4D874;--green-mint:#98FF98;--ink:#020403;
    --panel:rgba(12,28,32,0.48);--panel-border:rgba(255,255,255,0.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--ink);color:var(--gold);font-family:'Space Mono',monospace;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  #rain{position:fixed;inset:0;z-index:0;display:block;}
  #burst{position:fixed;inset:0;z-index:1;pointer-events:none;}
  #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(2,4,3,0.10) 0%,rgba(2,4,3,0.60) 55%,rgba(2,4,3,0.93) 100%);}
  #scroll-wrap{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 1.25rem;}
  .brand-wordmark{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(1.4rem,5vw,2.4rem);letter-spacing:.18em;color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.40);will-change:transform;transition:transform .12s ease-out;}
  .brand-sub{font-family:'Orbitron',sans-serif;font-weight:600;font-size:.65rem;letter-spacing:.6em;color:var(--green-mint);margin-top:.45rem;margin-bottom:2rem;}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--panel-border);backdrop-filter:blur(28px) saturate(1.45);-webkit-backdrop-filter:blur(28px) saturate(1.45);padding:2.4rem 2rem;border-radius:1.75rem;box-shadow:0 20px 60px rgba(0,0,0,0.35),0 2px 12px rgba(16,185,129,0.1),inset 0 1px 0 rgba(255,255,255,0.28);text-align:center;will-change:transform;transition:transform .12s ease-out;}
  .card-eyebrow{font-size:.6rem;letter-spacing:.5em;color:var(--green-mint);margin-bottom:.7rem;opacity:.75;}
  .card-title{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(1rem,3vw,1.35rem);letter-spacing:.2em;color:var(--gold-bright);}
  .card-sub{font-size:.72rem;color:rgba(152,255,152,.65);margin-top:.8rem;letter-spacing:.1em;line-height:1.6;}
  .pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green-mint);box-shadow:0 0 12px rgba(152,255,152,.7);margin-top:1.4rem;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.1);}}
</style>
</head>
<body class="glass-ui">
<canvas id="rain"></canvas>
<canvas id="burst"></canvas>
<div id="vignette"></div>
<div id="scroll-wrap">
  <div class="brand-wordmark" id="wordmark">ROBINHOOD</div>
  <div class="brand-sub">ALLIANCE</div>
  <div class="card" id="logout-card">
    <div class="card-eyebrow">SESSION TERMINATED</div>
    <div class="card-title">SIGNING OUT</div>
    <div class="card-sub">// clearing credentials //<br>redirecting to secure portal…</div>
    <div class="pulse" aria-hidden="true"></div>
  </div>
</div>
<script>
try{
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  localStorage.removeItem('preferred_currency');
}catch(e){}

const rainCanvas=document.getElementById('rain');
const rctx=rainCanvas.getContext('2d');
let cols,drops,fontSize=16;
function sizeRain(){rainCanvas.width=innerWidth;rainCanvas.height=innerHeight;cols=Math.floor(rainCanvas.width/fontSize);drops=new Array(cols).fill(0).map(()=>Math.random()*-100);}
sizeRain();addEventListener('resize',sizeRain);
function drawRain(){
  rctx.fillStyle='rgba(2,4,3,0.12)';rctx.fillRect(0,0,rainCanvas.width,rainCanvas.height);
  rctx.font=fontSize+'px monospace';
  for(let i=0;i<cols;i++){
    const char=Math.random()<0.5?'0':'1';
    const x=i*fontSize,y=drops[i]*fontSize;
    rctx.fillStyle=Math.random()<0.05?'#F4D874':'rgba(152,255,152,0.75)';
    rctx.fillText(char,x,y);
    if(y>rainCanvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
  requestAnimationFrame(drawRain);
}
requestAnimationFrame(drawRain);

const burstCanvas=document.getElementById('burst');
const bctx=burstCanvas.getContext('2d');
function sizeBurst(){burstCanvas.width=innerWidth;burstCanvas.height=innerHeight;}
sizeBurst();addEventListener('resize',sizeBurst);
let particles=[];
function spawnBurst(x,y){
  for(let i=0;i<14;i++){
    const angle=(Math.PI*2*i/14)+Math.random()*0.4;
    const speed=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,char:Math.random()<0.5?'0':'1',size:fontSize+Math.random()*10});
  }
}
function drawBurst(){
  bctx.clearRect(0,0,burstCanvas.width,burstCanvas.height);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.018;bctx.globalAlpha=Math.max(p.life,0);bctx.fillStyle='#D4AF37';bctx.shadowColor='#98FF98';bctx.shadowBlur=12;bctx.font=p.size+'px monospace';bctx.fillText(p.char,p.x,p.y);});
  bctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(drawBurst);
}
requestAnimationFrame(drawBurst);
addEventListener('pointerdown',e=>spawnBurst(e.clientX,e.clientY));

const wordmark=document.getElementById('wordmark');
const card=document.getElementById('logout-card');
function applyTilt(el,x,y,str){const r=el.getBoundingClientRect();const rx=(x-r.left)/r.width-0.5;const ry=(y-r.top)/r.height-0.5;el.style.transform=`rotateX(${(-ry*str).toFixed(2)}deg) rotateY(${(rx*str).toFixed(2)}deg) translateZ(6px)`;}
function resetTilt(el){el.style.transform='rotateX(0) rotateY(0) translateZ(0)';}
addEventListener('pointermove',e=>{applyTilt(wordmark,e.clientX,e.clientY,12);applyTilt(card,e.clientX,e.clientY,4);});
addEventListener('pointerleave',()=>{resetTilt(wordmark);resetTilt(card);});

setTimeout(function(){window.location.replace('login.html');},1800);
</script>
<script src="/static/js/ra-theme.js?v=1790230000"></script>
</body>
</html>
