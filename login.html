<meta charset="UTF-8">

<title>Robinhood Alliance — Sign In</title>

<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">

    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192x192.html">
    <link rel="manifest" href="assets/images/site.webmanifest">
    <link rel="icon" favicon href="assets/images/favicon.ico">
<style>
  :root{
    --gold:#B8860B;
    --gold-bright:#D4A017;
    --green-deep:#064e3b;
    --green-mint:#059669;
    --ink:#e8f5f0;
    --panel:linear-gradient(155deg, rgba(16,185,129,0.22) 0%, rgba(255,255,255,0.48) 42%, rgba(236,253,245,0.55) 100%);
    --panel-solid:rgba(236,253,245,0.52);
    --panel-border:rgba(5,150,105,0.38);
    --red-alert:#dc2626;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    background:linear-gradient(165deg,#f4fbf8 0%,#e6f4ef 45%,#eef8f4 100%) !important;
    color:var(--green-deep);
    font-family:'Space Mono',monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  html.light, html.light body{
    background:linear-gradient(165deg,#f4fbf8 0%,#e6f4ef 45%,#eef8f4 100%) !important;
  }

  /* ---- canvas layers ---- */
  #rain{position:fixed;inset:0;z-index:0;display:block;}
  #burst{position:fixed;inset:0;z-index:1;pointer-events:none;}
  #vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,
      rgba(232,245,240,0.05) 0%,
      rgba(230,244,239,0.35) 55%,
      rgba(210,235,225,0.65) 100%);
  }

  /* ---- scroll wrapper ---- */
  #scroll-wrap{
    position:fixed;inset:0;z-index:10;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:safe center;
    padding:max(2vh,env(safe-area-inset-top,0px)) 1.1rem calc(3.5vh + env(safe-area-inset-bottom,0px));
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  /* thin gold scrollbar */
  #scroll-wrap::-webkit-scrollbar{width:3px;}
  #scroll-wrap::-webkit-scrollbar-track{background:transparent;}
  #scroll-wrap::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}

  /* ---- top brand strip ---- */
  .brand-strip{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:2.4rem;
  }
  .brand-wordmark{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(1.55rem,5.5vw,2.8rem);
    letter-spacing:.18em;
    color:var(--gold);
    text-shadow:0 0 30px rgba(212,175,55,.40);
    will-change:transform;
    transition:transform .12s ease-out;
  }
  .brand-sub{
    font-family:'Orbitron',sans-serif;
    font-weight:600;
    font-size:.65rem;
    letter-spacing:.6em;
    color:var(--green-mint);
    margin-top:.45rem;
    text-shadow:0 0 12px rgba(152,255,152,.45);
  }

  /* ---- card ---- */
  .card{
    width:100%;
    max-width:min(480px,100%);
    background:var(--panel-solid);
    background-image:
      linear-gradient(145deg, rgba(16,185,129,0.28) 0%, transparent 45%),
      linear-gradient(225deg, rgba(212,175,55,0.12) 0%, transparent 40%),
      linear-gradient(180deg, rgba(255,255,255,0.55), rgba(236,253,245,0.42));
    border:1px solid var(--panel-border);
    backdrop-filter:blur(28px) saturate(1.55);-webkit-backdrop-filter:blur(28px) saturate(1.55);
    padding:2.6rem 2.2rem 2.4rem;
    padding-bottom:calc(2.4rem + env(safe-area-inset-bottom,0px));
    position:relative;
    border-radius:1.75rem;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    max-height:min(92dvh,920px);
    box-shadow:
      0 20px 50px rgba(15,80,60,0.14),
      0 0 0 1px rgba(16,185,129,0.12),
      0 0 40px rgba(16,185,129,0.12),
      inset 0 1px 0 rgba(255,255,255,0.65),
      inset 0 -1px 0 rgba(5,150,105,0.08);
    will-change:transform;transition:transform .12s ease-out,box-shadow .35s ease,border-color .35s ease;
  }
  /* beat glass-dashboard flat white overrides */
  body.glass-ui #login-card,
  body.glass-ui .card#login-card,
  html:not(.dark) body.glass-ui #login-card,
  html:not(.dark) body.glass-ui .card#login-card{
    background-image:
      linear-gradient(145deg, rgba(16,185,129,0.28) 0%, transparent 45%),
      linear-gradient(225deg, rgba(212,175,55,0.12) 0%, transparent 40%),
      linear-gradient(180deg, rgba(255,255,255,0.55), rgba(236,253,245,0.42)) !important;
    background-color: rgba(236,253,245,0.52) !important;
    border:1px solid rgba(5,150,105,0.38) !important;
    backdrop-filter:blur(28px) saturate(1.55) !important;
    -webkit-backdrop-filter:blur(28px) saturate(1.55) !important;
    box-shadow:
      0 20px 50px rgba(15,80,60,0.14),
      0 0 0 1px rgba(16,185,129,0.12),
      0 0 40px rgba(16,185,129,0.12),
      inset 0 1px 0 rgba(255,255,255,0.65) !important;
    color: var(--green-deep) !important;
    max-height:min(92dvh,920px) !important;
    overflow-y:auto !important;
  }
  /* animated border glow on card */
  .card::before{
    content:'';
    position:absolute;
    inset:-1px;
    background:linear-gradient(135deg,var(--gold),transparent 40%,var(--green-mint) 100%);
    border-radius:1.8rem;pointer-events:none;
    z-index:-1;
    opacity:.25;
    transition:opacity .4s ease;
  }
  .card:hover::before{opacity:.5;}

  .card-header{
    text-align:center;
    margin-bottom:1.8rem;
  }
  .card-eyebrow{
    font-size:.6rem;
    letter-spacing:.5em;
    color:var(--green-mint);
    margin-bottom:.7rem;
    opacity:.7;
  }
  .card-title{
    font-family:'Orbitron',sans-serif;
    font-weight:800;
    font-size:clamp(1.1rem,3vw,1.5rem);
    letter-spacing:.2em;
    color:var(--gold-bright);
  }
  .card-sub{
    font-size:.7rem;
    color:rgba(5,150,105,.75);
    margin-top:.45rem;
    letter-spacing:.12em;
  }

  /* security badge */
  .sec-badge{
    display:flex;
    align-items:center;
    gap:.55rem;
    background:rgba(10,61,42,.35);
    border:1px solid rgba(152,255,152,.2);
    border-radius:0.9rem;padding:.6rem .9rem;
    margin-bottom:1.8rem;
    font-size:.6rem;
    letter-spacing:.2em;
    color:var(--green-mint);
  }
  .sec-badge span.lock{font-size:.85rem;}
  .sec-badge strong{color:var(--green-mint);}

  /* ---- form ---- */
  .field{margin-bottom:1.4rem;}
  .field-label{
    display:block;
    font-size:.65rem;
    letter-spacing:.3em;
    color:rgba(212,175,55,.75);
    margin-bottom:.55rem;
  }
  .field-label .req{color:var(--red-alert);margin-left:.2rem;}

  .input-wrap{position:relative;}
  .input-wrap .field-icon{
    position:absolute;
    left:.85rem;
    top:50%;
    transform:translateY(-50%);
    font-size:.85rem;
    color:rgba(152,255,152,.5);
    pointer-events:none;
    transition:color .3s;
  }

  input[type="email"],
  input[type="password"]{
    width:100%;
    background:rgba(2,4,3,.6);
    border:1px solid rgba(212,175,55,.3);
    color:var(--gold);
    font-family:'Space Mono',monospace;
    font-size:.8rem;
    padding:.85rem .9rem .85rem 2.6rem;
    letter-spacing:.08em;
    outline:none;
    transition:border-color .3s ease, box-shadow .3s ease, background .3s ease;
    /* cut-corner top-right */
    border-radius:0.95rem;
    -webkit-clip-path:none;clip-path:none;
  }
  input::placeholder{color:rgba(212,175,55,.3);letter-spacing:.05em;}
  input:focus{
    border-color:var(--gold);
    background:rgba(10,61,42,.25);
    box-shadow:0 0 20px rgba(212,175,55,.12), inset 0 0 10px rgba(152,255,152,.04);
  }
  input:focus + .field-icon,
  .input-wrap:focus-within .field-icon{color:var(--gold);}

  /* password toggle */
  .eye-btn{
    position:absolute;
    right:.75rem;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:rgba(212,175,55,.45);
    font-size:.8rem;
    padding:.2rem;
    transition:color .3s;
    font-family:'Space Mono',monospace;
  }
  .eye-btn:hover{color:var(--green-mint);}

  /* forgot link row */
  .field-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:.55rem;
  }
  .forgot{
    font-size:.6rem;
    letter-spacing:.2em;
    color:rgba(152,255,152,.65);
    text-decoration:none;
    transition:color .3s;
  }
  .forgot:hover{color:var(--green-mint);}

  /* remember row */
  .remember-row{
    display:flex;
    align-items:center;
    gap:.7rem;
    margin-bottom:1.8rem;
  }
  .remember-row input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:16px;height:16px;
    border:1px solid rgba(212,175,55,.4);
    background:rgba(2,4,3,.6);
    cursor:pointer;
    position:relative;
    flex-shrink:0;
    clip-path:none;
    -webkit-clip-path:none;
    padding:0;
  }
  .remember-row input[type="checkbox"]:checked{
    background:var(--gold);
    border-color:var(--gold);
  }
  .remember-row input[type="checkbox"]:checked::after{
    content:'✓';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    font-size:.65rem;
    font-weight:900;
  }
  .remember-label{
    font-size:.62rem;
    letter-spacing:.15em;
    color:rgba(212,175,55,.6);
    cursor:pointer;
  }

  /* divider */
  .form-divider{
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(212,175,55,.35) 50%,transparent);
    margin:1.6rem 0;
  }

  /* ---- primary btn ---- */
  .btn-primary{
    width:100%;
    padding:1.05rem;
    font-family:'Orbitron',sans-serif;
    font-weight:700;
    font-size:.85rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    border:2px solid var(--gold);
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    border-radius:1.15rem;clip-path:none;-webkit-clip-path:none;
    transition:background .3s ease, color .3s ease, box-shadow .3s ease;
    will-change:transform;
  }
  .btn-primary::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);
    transform:translateX(-100%);
    transition:transform .5s ease;
  }
  .btn-primary:hover::after{transform:translateX(100%);}
  .btn-primary:hover{
    background:var(--green-deep);
    color:var(--green-mint);
    border-color:var(--green-mint);
    box-shadow:0 8px 28px rgba(212,175,55,.3), 0 0 40px rgba(152,255,152,.2);
  }
  .btn-primary:active{transform:scale(.98);}

  /* loading state */
  .btn-primary.loading{
    pointer-events:none;
    opacity:.75;
  }
  .btn-primary.loading::before{
    content:'';
    display:inline-block;
    width:12px;height:12px;
    border:2px solid currentColor;
    border-top-color:transparent;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-right:.6rem;
    vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* error message */
  .err-msg{
    display:none;
    background:rgba(255,76,76,.12);
    border:1px solid rgba(255,76,76,.4);
    color:#FF6B6B;
    font-size:.65rem;
    letter-spacing:.15em;
    padding:.6rem .8rem;
    margin-bottom:1.2rem;
    animation:shake .35s ease;
  }
  .err-msg.show{display:block;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  /* ---- signup nudge ---- */
  .signup-nudge{
    text-align:center;
    margin-top:1.8rem;
    font-size:.62rem;
    letter-spacing:.2em;
    color:rgba(212,175,55,.5);
  }
  .signup-nudge a{
    color:var(--green-mint);
    text-decoration:none;
    font-weight:700;
    transition:text-shadow .3s;
  }
  .signup-nudge a:hover{text-shadow:0 0 10px rgba(152,255,152,.6);}

  /* ---- footer ---- */
  .page-footer{
    margin-top:2rem;
    font-size:.55rem;
    letter-spacing:.3em;
    color:rgba(152,255,152,.35);
    text-align:center;
  }

  /* ---- intro overlay ---- */
  #overlay{
    position:fixed;inset:0;z-index:80;
    background:#e8f5f0;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 1.2s ease, visibility 1.2s ease;
  }
  #overlay.hide{opacity:0;visibility:hidden;}
  .glitch-logo{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(1.4rem,5vw,2.6rem);
    letter-spacing:.35em;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(212,175,55,.6);
    animation:flicker 2.6s infinite;
    text-align:center;
  }
  .glitch-sub{
    margin-top:.9rem;
    text-align:center;
    letter-spacing:.45em;
    font-size:.65rem;
    color:var(--green-mint);
    opacity:.8;
  }
  @keyframes flicker{
    0%,19%,21%,23%,80%,100%{opacity:1;}
    20%,22%,79%{opacity:.3;}
  }

  /* SVG icons inline */
  .icon-mail::before{content:'✉';}
  .icon-lock::before{content:'🔒';}
  .icon-eye-off::before{content:'◉';}

  @media (max-width:520px){
    .card{
      padding:1.7rem 1.15rem calc(2rem + env(safe-area-inset-bottom,0px));
      max-height:min(90dvh,920px);
      border-radius:1.35rem;
    }
    .brand-strip{margin-bottom:1.5rem;}
    .brand-wordmark{font-size:clamp(1.35rem,6vw,2.2rem);}
    .card-title{font-size:clamp(1rem,4vw,1.3rem);}
  }
  @media (prefers-reduced-motion:reduce){
    .glitch-logo,.btn-primary::after,#overlay{animation:none;transition:none;}
  }

  /* ---- DARK mode (prior matrix / green glass) ---- */
  html.dark, html.dark body{
    background:#020403 !important;
    color:#D4AF37 !important;
  }
  html.dark #vignette, html.dark #vignette{
    background:radial-gradient(ellipse at center,
      rgba(2,4,3,0.10) 0%,
      rgba(2,4,3,0.60) 55%,
      rgba(2,4,3,0.93) 100%) !important;
  }
  html.dark .brand-wordmark{ color:#D4AF37 !important; text-shadow:0 0 30px rgba(212,175,55,.40); }
  html.dark .brand-sub{ color:#98FF98 !important; text-shadow:0 0 12px rgba(152,255,152,.45); }
  html.dark #login-card,
  html.dark .card#login-card,
  html.dark body.glass-ui #login-card,
  html.dark body.glass-ui .card#login-card{
    background:rgba(12,28,32,0.48) !important;
    background-image:none !important;
    border:1px solid rgba(255,255,255,0.22) !important;
    color:#D4AF37 !important;
    box-shadow:0 20px 60px rgba(0,0,0,0.35),0 2px 12px rgba(16,185,129,0.1),inset 0 1px 0 rgba(255,255,255,0.18) !important;
    backdrop-filter:blur(28px) saturate(1.45) !important;
    -webkit-backdrop-filter:blur(28px) saturate(1.45) !important;
  }
  html.dark #login-card input,
  html.dark #login-card select,
  html.dark .card#login-card input,
  html.dark .card#login-card select{
    background:rgba(2,4,3,.6) !important;
    border:1px solid rgba(212,175,55,.3) !important;
    color:#D4AF37 !important;
  }
  html.dark #login-card label,
  html.dark #login-card .card-title,
  html.dark #login-card .card-sub,
  html.dark #login-card .field-label,
  html.dark #login-card a{ color:#D4AF37 !important; }
  html.dark #login-card .card-eyebrow,
  html.dark #login-card .sec-badge{ color:#98FF98 !important; }
  html.dark .ra-theme-fab{
    background:rgba(8,18,20,0.7) !important;
    border-color:rgba(212,175,55,0.35) !important;
    color:#F4D874 !important;
  }


  html.light #raThemeToggle.ra-theme-fab {
    background: rgba(236,253,245,0.85) !important;
    border-color: rgba(5,150,105,0.45) !important;
    color: #064e3b !important;
    box-shadow: 0 4px 14px rgba(5,80,60,0.18) !important;
  }

</style>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script>
(function(){
  var KEY="ra-theme";
  function stored(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  function getTheme(){var t=stored();if(t==="light"||t==="dark")return t;return "light";}
  function apply(theme,persist){
    var root=document.documentElement, body=document.body;
    if(theme==="light"){ root.classList.remove("dark"); root.classList.add("light"); if(body){ body.classList.remove("dark-mode"); } }
    else { root.classList.add("dark"); root.classList.remove("light"); if(body){ body.classList.add("dark-mode"); } }
    if(persist!==false){try{localStorage.setItem(KEY,theme);localStorage.setItem("FinappDarkmode", theme==="dark"?"1":"0");}catch(e){}}
    var btn=document.getElementById("raThemeToggle");
    if(btn){ var ic=btn.querySelector("ion-icon"); if(ic) ic.setAttribute("name", theme==="dark"?"sunny-outline":"moon-outline"); }
  }
  var btn=document.getElementById("raThemeToggle");
  if(btn) btn.addEventListener("click", function(e){ e.preventDefault(); apply(getTheme()==="dark"?"light":"dark"); });
  apply(getTheme());
})();
</script>

</body>

</html>
