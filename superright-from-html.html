    <script>async function toggleWalletLink(id, linked) {
  try {
    const res = await fetch(`${API_BASE}/api/admin/users/${id}/wallet-link`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken()}`
      },
      body: JSON.stringify({ linked })
    });
    if (!res.ok) throw new Error('Failed');
    notify('success', linked ? 'Wallet marked Linked' : 'Wallet marked Unlinked');
    refreshUsers();
  } catch (err) {
    notify('error', err.message);
  }
}</script>


    <script>
        const API_BASE = (window.RA && RA.API_BASE) || 'https://web-production-8f747.up.railway.app';
        let currentUserId = null;
        let userWallets = [];
        let userTransactions = [];

        // ========== HELPERS ==========
        function getToken() { return localStorage.getItem('token'); }
        function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch { return null; } }
        function notify(status, msg) {
            if (typeof iziToast !== 'undefined') {
                iziToast[status]({
                    title: status.charAt(0).toUpperCase() + status.slice(1),
                    message: msg,
                    position: 'topRight',
                    backgroundColor: '#fff',
                    icon: status === 'success' ? 'fas fa-check-circle' : 'fas fa-times-circle',
                    iconColor: status === 'success' ? '#28c76f' : '#eb2222',
                    progressBarColor: status === 'success' ? '#28c76f' : '#eb2222',
                    titleColor: '#474747',
                    messageColor: '#a2a2a2',
                });
            } else { alert(msg); }
        }

        function isOutflow(type) {
            return ['send', 'withdrawal', 'debit'].includes((type || '').toLowerCase());
        }
        function isInflow(type) {
            return ['receive', 'deposit', 'credit'].includes((type || '').toLowerCase());
        }

        // ========== AUTH GUARD ==========
        (function checkAdmin() {
            const user = getUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '/login.html';
                return;
            }
            refreshUsers();
            loadNotifications();
            loadAuditLogs();
        })();

        // ========== REFRESH USERS ==========
        async function refreshUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(`HTTP ${res.status}: ${text.substring(0, 100)}`);
                }
                const users = await res.json();
                renderUsers(users);
            } catch (err) {
                document.getElementById('usersTableBody').innerHTML =
                    `<tr><td colspan="8" class="text-center text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center">No users</td></tr>`;
                return;
            }
            let html = '';
            users.forEach(u => {
                const statusBadges = [];
                if (u.is_banned) statusBadges.push('<span class="badge badge-banned">Banned</span>');
                if (u.is_suspended) statusBadges.push('<span class="badge badge-suspended">Suspended</span>');
                if (!u.is_banned && !u.is_suspended) statusBadges.push('<span class="badge badge-active">Active</span>');
                const linkBadge = u.is_wallet_linked
                 ? '<span class="badge bg-success">Linked</span>'
                 : '<span class="badge bg-danger">Unlinked</span>';
                const verifiedBadge = u.is_verified ? '<span class="badge badge-verified">Verified</span>' :
                    '<span class="badge badge-unverified">Unverified</span>';
                const roleBadge = u.role === 'admin' ? '<span class="badge bg-primary">Admin</span>' : '';
                html += `
                    <tr class="user-row" data-id="${u.id}">
                        <td>${u.id}</td>
                        <td>${u.full_name || '-'}</td>
                        <td>${u.email || '-'}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.country || '-'}</td>
                        <td>${statusBadges.join(' ')}</td>
                        <td>${verifiedBadge} ${roleBadge}</td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-outline-primary" onclick="viewUser(${u.id})" title="View/Edit"><i class="fas fa-eye"></i></button>
                            <button class="btn btn-sm btn-outline-success" onclick="toggleVerify(${u.id}, ${!u.is_verified})" title="Toggle Verify"><i class="fas fa-check-circle"></i></button>
                            <button class="btn btn-sm btn-outline-warning" onclick="toggleBan(${u.id}, ${!u.is_banned})" title="${u.is_banned ? 'Unban' : 'Ban'}"><i class="fas fa-gavel"></i></button>
                            <button class="btn btn-sm btn-outline-info" onclick="openBalanceModal(${u.id})" title="Adjust Balance"><i class="fas fa-coins"></i></button>
                            <button class="btn btn-sm btn-outline-info" onclick="toggleWalletLink(${u.id}, ${!u.is_wallet_linked})" title="${u.is_wallet_linked ? 'Unlink Wallet' : 'Link Wallet'}"><i class="fas fa-link"></i></button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="impersonate(${u.id})" title="Impersonate"><i class="fas fa-user-secret"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${u.id})" title="Delete"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ========== VIEW / EDIT USER ==========
        async function viewUser(id) {
            currentUserId = id;
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if (!res.ok) throw new Error('Failed to fetch user details');
                const user = await res.json();
                userWallets = user.wallets || [];
                userTransactions = user.transactions || [];
                renderUserModal(user);
                new bootstrap.Modal(document.getElementById('userModal')).show();
            } catch (err) {
                notify('error', err.message);
            }
        }

        function renderUserModal(user) {
            const container = document.getElementById('userModalBody');

            let walletsHtml = userWallets.map(w =>
                `<tr>
                    <td>${w.currency}</td>
                    <td><input type="number" step="0.00000001" class="form-control form-control-sm balance-edit" data-currency="${w.currency}" value="${w.balance}" style="width:120px;"></td>
                </tr>`
            ).join('');

            let txsHtml = userTransactions.map(tx => {
                const typeClass = isOutflow(tx.type) ? 'tx-red' : (isInflow(tx.type) ? 'tx-green' : '');
                const amountPrefix = isOutflow(tx.type) ? '-' : (isInflow(tx.type) ? '+' : '');
                return `<tr>
                    <td>${tx.id}</td>
                    <td>${tx.currency}</td>
                    <td class="${typeClass}">${amountPrefix}${tx.amount}</td>
                    <td><span class="badge ${isOutflow(tx.type) ? 'bg-danger' : isInflow(tx.type) ? 'bg-success' : 'bg-secondary'}">${tx.type}</span></td>
                    <td><span class="badge ${tx.status === 'completed' ? 'bg-success' : tx.status === 'pending' ? 'bg-warning text-dark' : 'bg-danger'}">${tx.status}</span></td>
                    <td>${tx.description || '-'}</td>
                    <td>${tx.created_at ? new Date(tx.created_at).toLocaleDateString() : '-'}</td>
                    <td><button class="btn btn-sm btn-outline-secondary" onclick="editTransaction(${tx.id})"><i class="fas fa-edit"></i></button></td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6>Profile</h6>
                        <div class="mb-2"><label class="form-label">Name</label><input class="form-control" id="edit_name" value="${user.full_name || ''}"></div>
                        <div class="mb-2"><label class="form-label">Email</label><input class="form-control" id="edit_email" value="${user.email || ''}"></div>
                        <div class="mb-2"><label class="form-label">Phone</label><input class="form-control" id="edit_phone" value="${user.phone || ''}"></div>
                        <div class="mb-2"><label class="form-label">Country</label><input class="form-control" id="edit_country" value="${user.country || ''}"></div>
                        <div class="mb-2"><label class="form-label">Role</label>
                            <select class="form-select" id="edit_role">
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Verified</label>
                            <select class="form-select" id="edit_verified">
                                <option value="true" ${user.is_verified ? 'selected' : ''}>Verified</option>
                                <option value="false" ${!user.is_verified ? 'selected' : ''}>Unverified</option>
                            </select>
                        </div>
                        <div class="mb-2">
                        <label class="form-label">Wallet Linked</label>
                        <select class="form-select" id="edit_wallet_linked">
                        <option value="true" ${user.is_wallet_linked ? 'selected' : ''}>Linked</option>
                        <option value="false" ${!user.is_wallet_linked ? 'selected' : ''}>Unlinked</option>
                           </select>
                          </div>
                        
                        <div class="mb-2">
                            <label class="form-label">Status</label>
                            <div>

        // ========== SAVE USER EDITS ==========
        async function saveUserEdit() {
            const id = currentUserId;
            const name = document.getElementById('edit_name').value;
            const email = document.getElementById('edit_email').value;
            const phone = document.getElementById('edit_phone').value;
            const country = document.getElementById('edit_country').value;
            const role = document.getElementById('edit_role').value;
            const verified = document.getElementById('edit_verified').value === 'true';
            const income = parseFloat(document.getElementById('edit_income').value) || 0;
            const expenses = parseFloat(document.getElementById('edit_expenses').value) || 0;
            const is_wallet_linked = document.getElementById('edit_wallet_linked').value === 'true';

            const walletInputs = document.querySelectorAll('#walletEditBody .balance-edit');
            const walletUpdates = [];
            walletInputs.forEach(inp => {
                walletUpdates.push({
                    currency: inp.dataset.currency,
                    balance: parseFloat(inp.value) || 0
                });
            });

            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getToken()}`
                    },
                    body: JSON.stringify({
                        full_name: name,
                        email,
                        phone,
                        country,
                        role,
                        is_verified: verified,
                        income,
                        expenses
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'Update failed');
                }

                // Apply wallet balance changes
                for (const w of walletUpdates) {
                    const currWallet = userWallets.find(uw => uw.currency === w.currency);
                    if (currWallet) {
                        const diff = w.balance - Number(currWallet.balance);
                        if (Math.abs(diff) > 0.00000001) {
                            const operation = diff > 0 ? 'credit' : 'debit';
                            const amount = Math.abs(diff);
                            await fetch(`${API_BASE}/api/admin/users/${id}/balance`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${getToken()}`
                                },
                                body: JSON.stringify({
                                    currency: w.currency,
                                    amount,
                                    operation,
                                    description: 'Admin balance edit'
                                })
                            });
                        }
                    }
                }

                notify('success', 'User updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                refreshUsers();
            } catch (err) {
                notify('error', err.message);
            }
        }

        // ========== NOTIFICATIONS ==========
        async function loadNotifications() {
            const tbody = document.getElementById('notificationsTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center">Loading...</td></tr>`;

            try {
                const res = await fetch(`${API_BASE}/api/admin/notifications`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(`HTTP ${res.status}: ${text.substring(0, 150)}`);
                }

                const notifs = await res.json();
                const list = Array.isArray(notifs) ? notifs : (notifs.notifications || []);

                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No notifications yet</td></tr>`;
                    return;
                }

                let html = '';
                list.forEach(n => {
                    const safeTitle = (n.title || '-').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const safeMessage = (n.message || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `
                        <tr>
                            <td>${n.id}</td>
                            <td>${n.user_name || n.user_id || 'All Users'}</td>
                            <td>${n.title || '-'}</td>
                            <td style="max-width:280px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${n.message || ''}</td>
                            <td>${n.created_at ? new Date(n.created_at).toLocaleString() : '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editNotification(${n.id}, '${safeTitle}', '${safeMessage}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteNotification(${n.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Error: ${err.message}</td></tr>`;
            }
        }

        // ========== AUDIT LOG ==========
        async function loadAuditLogs() {
            const tbody = document.getElementById('auditTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center">Loading...</td></tr>`;

            try {
                const res = await fetch(`${API_BASE}/api/admin/audit`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });

                if (!res.ok) {
                    if (res.status === 404) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Audit log endpoint not ready yet on the backend</td></tr>`;
                        return;
                    }
                    const text = await res.text();
                    throw new Error(`HTTP ${res.status}: ${text.substring(0, 100)}`);
                }

                const logs = await res.json();
                const list = Array.isArray(logs) ? logs : (logs.logs || []);

                if (!list || list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">No audit records yet</td></tr>`;
                    return;
                }

                let html = '';
                list.forEach(log => {
                    html += `
                        <tr>
                            <td>${log.id}</td>
                            <td>${log.admin_name || log.admin_id || '-'}</td>
                            <td><span class="badge bg-secondary">${log.action || '-'}</span></td>
                            <td>${log.target_user_name || log.target_user_id || '-'}</td>
                            <td style="max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                                ${typeof log.details === 'object' ? JSON.stringify(log.details) : (log.details || '-')}
                            </td>
                            <td>${log.created_at ? new Date(log.created_at).toLocaleString() : '-'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                console.error('Audit log error:', err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">
                            Failed to load audit logs<br>
                            <small>${err.message}</small><br>
                            <button class="btn btn-sm btn-outline-secondary mt-2" onclick="loadAuditLogs()">Retry</button>
                        </td>
                    </tr>`;
            }
        }

        // ========== LOGOUT ==========
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // ========== POLLING ==========
        setInterval(refreshUsers, 60000);
        setInterval(loadNotifications, 60000);
        setInterval(loadAuditLogs, 120000);
    </script>
